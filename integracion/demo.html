<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo botón Preview</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; padding: 40px; }
    .entregable { border: 1px solid #cfe0f7; background: #eef5fe; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    button { font-size: 16px; padding: 8px 16px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Demo: botón Preview integrado</h1>

  <div class="entregable">
    <strong>Spotify Header / Banner</strong>
    <p><button data-entregable="Spotify Header / Banner" data-imagen="../assets/spotify.jpg">👁 Preview</button></p>
  </div>

  <div class="entregable">
    <strong>TIDAL Banner</strong>
    <p><button data-entregable="TIDAL Banner" data-imagen="../assets/spotify.jpg">👁 Preview</button></p>
  </div>

  <div class="entregable">
    <strong>YouTube Channel Banner</strong>
    <p><button data-entregable="YouTube Channel Banner" data-imagen="../assets/spotify.jpg">👁 Preview</button></p>
  </div>

  <div class="entregable">
    <strong>Amazon Music Banner</strong>
    <p><button data-entregable="Amazon Music Banner" data-imagen="../assets/spotify.jpg">👁 Preview</button></p>
  </div>

  <p style="color:#777">En la demo se usa la misma imagen de ejemplo para todas las plataformas. En el sistema, cada botón usa la imagen subida.</p>

  <script src="preview-modal.js"></script>
  <script>
    // Cada botón abre el preview con su entregable y su imagen (URL absoluta).
    document.querySelectorAll('button[data-entregable]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var imagen = new window.URL(btn.dataset.imagen, window.location.href).href;
        abrirPreviewBanner(btn.dataset.entregable, imagen);
      });
    });
  </script>
</body>
</html>
